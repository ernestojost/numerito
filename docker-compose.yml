services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turnia
      POSTGRES_PASSWORD: turnia
      POSTGRES_DB: turnia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnia"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:

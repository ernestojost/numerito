# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: numerito-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: WEB_ORIGIN
        sync: false # Vercel URL
